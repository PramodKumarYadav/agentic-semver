name: Agentic SemVer

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

# This workflow records a recommendation on the pull request. It does not write
# to the branch, so it needs no write access to contents and no App token: the
# reasons those were here — making a bot commit start status checks, and stopping
# that commit from re-triggering this workflow — went away with the commit itself.
permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  version:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # bundle/ is committed and ci.yml fails when it drifts, so the action runs
      # straight from the checkout — no install, no build, no test gate. Nothing
      # this job does can land on the branch, so there is nothing to gate.
      - name: Recommend a semantic version
        uses: ./
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
