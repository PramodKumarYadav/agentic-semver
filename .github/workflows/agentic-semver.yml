name: Agentic SemVer

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
    # Version metadata alone is never worth an analysis run. Note this filter is
    # evaluated against the whole pull request diff, so it only skips a PR that
    # changes nothing else — the action's own loop guard handles the bump commit.
    paths-ignore:
      - package.json
      - package-lock.json
      - CHANGELOG.md

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  version:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest

    # Surfaced as env because the `secrets` context is not dependable inside a
    # step-level `if:`. Reading it through `env` is unambiguous.
    env:
      HAS_APP: ${{ secrets.SEMVER_APP_ID != '' && secrets.SEMVER_APP_PRIVATE_KEY != '' }}

    steps:
      # Pushes made with GITHUB_TOKEN do not start workflow runs — GitHub blocks that
      # to stop a workflow re-triggering itself. That also means the bump commit this
      # action pushes reports no status checks, which blocks merges once a required
      # check is configured. An App installation token is a different credential and
      # is not subject to that guard, and it attributes commits to the app rather than
      # to a person. Falls back to GITHUB_TOKEN when the App secrets are absent.
      - name: Mint a GitHub App token
        id: app-token
        if: ${{ env.HAS_APP == 'true' }}
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.SEMVER_APP_ID }}
          private-key: ${{ secrets.SEMVER_APP_PRIVATE_KEY }}

      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # The push identity comes from the credentials checkout persists, so this
          # token — not the one passed to the action below — decides whether the
          # bump commit starts a workflow run.
          token: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # Gate the bump on the tests. Without this the two workflows race, and a pull
      # request with failing tests still gets a version bump and a changelog entry.
      # ci.yml still owns the full check — it also covers draft pull requests, pushes
      # to main, and metadata-only pull requests that this workflow filters out.
      - name: Run tests
        run: npm test

      - name: Recommend and apply semantic version
        uses: ./
        with:
          github-token: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
