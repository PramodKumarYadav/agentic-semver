name: Agentic SemVer

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
    # Version metadata alone is never worth an analysis run. Note this filter is
    # evaluated against the whole pull request diff, so it only skips a PR that
    # changes nothing else — the action's own loop guard handles the bump commit.
    paths-ignore:
      - package.json
      - package-lock.json
      - CHANGELOG.md

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  version:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Recommend and apply semantic version
        uses: ./
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
