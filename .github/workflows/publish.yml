name: Create GitHub Release and Publish package to npm

on:
  push:
    branches:
      - main

permissions:
  contents: write # to create GitHub releases and tags
  id-token: write # for npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm test

      - name: Create GitHub release
        id: release
        uses: ./create-release
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Users reference this action as @v1, so the floating major tag has to
      # follow every release. Without it, the README examples resolve to nothing.
      - name: Move major version tag
        if: steps.release.outputs.released == 'true'
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          MAJOR="v${VERSION%%.*}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -f "$MAJOR"
          git push --force origin "refs/tags/$MAJOR"
          echo "Moved $MAJOR to $(git rev-parse --short HEAD)."

      - name: Publish package to npm
        if: steps.release.outputs.released == 'true'
        run: npm publish --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
