name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm test

      # GitHub Actions runs bundle/ straight from the checked-out repo and never
      # installs dependencies, so a stale bundle ships broken code to every user.
      - name: Verify committed bundle is up to date
        run: |
          if ! git diff --quiet --exit-code -- bundle; then
            echo "::error::bundle/ is out of date. Run 'npm run build' and commit the result."
            git diff --stat -- bundle
            exit 1
          fi
          echo "bundle/ is up to date."
