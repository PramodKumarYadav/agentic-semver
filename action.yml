name: Agentic SemVer
description: >
  Use Claude to recommend a semantic version bump and changelog entry for a pull request.
  Records the recommendation on the pull request for the apply-version action to apply after merge.
  Writes nothing to the branch.
branding:
  icon: tag
  color: purple
inputs:
  github-token:
    description: >
      GitHub token used to read pull request metadata, comment, and label. Needs only read access to
      contents — this action does not push. secrets.GITHUB_TOKEN is sufficient.
    required: true
  anthropic-api-key:
    description: Anthropic API key used to call Claude.
    required: true
  model:
    description: Claude model used for the analysis request.
    required: false
    default: claude-sonnet-4-5
  version-file-path:
    description: >
      Path to the version file to update. Auto-detected when not specified.
      Supported files: package.json, pyproject.toml, pom.xml, gradle.properties, Cargo.toml, Chart.yaml, composer.json.
    required: false
    default: ""
  changelog-path:
    description: Path to the changelog file that should be updated.
    required: false
    default: CHANGELOG.md
  target-base-branch:
    description: Only process pull requests that target this base branch.
    required: false
    default: main
  max-files:
    description: Maximum number of changed files to include in the Claude prompt.
    required: false
    default: "40"
  comment-summary:
    description: >
      Include the human-readable write-up in the pull request comment. A comment is posted either way:
      it carries the recommendation that the apply-version action reads back after the merge.
    required: false
    default: "true"
  apply-label:
    description: Apply a label (major, minor, or patch) to the pull request based on the recommended bump. Requires the workflow token to have issues:write permission.
    required: false
    default: "true"
outputs:
  skipped:
    description: Whether the action skipped processing.
  bump:
    description: Recommended semantic version bump.
  current-version:
    description: Version found on the base branch at analysis time.
  next-version:
    description: Version this bump would produce. Provisional — the version is settled after the merge.
  summary:
    description: Claude summary of the pull request changes.
  changelog-entry:
    description: Markdown changelog entry generated for the release.
runs:
  using: node20
  main: bundle/action/index.js
